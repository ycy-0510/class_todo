name: class_todo_list
description: "A fully shared online contact book"
publish_to: "none"
version: 2.3.2+59

environment:
  sdk: ">=3.1.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.0
  firebase_app_check: ^0.3.1+2
  cloud_firestore: ^5.4.2
  firebase_crashlytics: ^4.1.2
  firebase_messaging: ^15.1.3
  flutter_riverpod: ^2.6.1
  fluttertoast: ^8.2.2
  connectivity_plus: ^6.1.0
  flutter_native_splash: ^2.4.4
  go_router: ^14.6.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.1.14
  http: ^1.1.0
  google_sign_in: ^6.3.0
  grouped_list: ^6.0.0
  intl: ^0.19.0
  dart_rss: ^3.0.3
  flutter_widget_from_html_core: ^0.15.2
  cupertino_icons: ^1.0.8
  share_plus: ^10.0.2
  font_awesome_flutter: ^10.7.0
  crypto: ^3.0.5
  package_info_plus: ^8.0.2
  googleapis: ^13.2.0
  rxdart: ^0.28.0
  toastification: ^2.3.0
  smooth_page_indicator: ^1.2.0+3
  firebase_remote_config: ^5.1.3
  permission_handler: ^11.3.1
  animations: ^2.0.11
  feedback: 
    git:
      url: https://github.com/ycy-0510/feedback.git
      ref: master
      path: feedback
  feedback_sentry:
    git:
      url: https://github.com/ycy-0510/feedback.git
      ref: temp
      path: feedback_sentry
  sentry_flutter: ^8.13.0
  introduction_screen: ^3.1.14
  force_update_helper: ^0.1.5
  app_links: ^6.3.2
  mixpanel_flutter: ^2.3.3
  photo_view: ^0.15.0
  cunning_document_scanner: ^1.2.3
  flutter_image_compress: ^2.4.0
  flutter_tawk_to_chat: ^0.4.0
  firebase_storage: ^12.4.2
  path_provider: ^2.1.5
  excel: ^4.0.6
  flutter_cache_manager: ^3.4.1
  file_picker: ^9.0.1
  logger: ^2.5.0
  camerawesome: ^2.1.0
  adaptive_dialog: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  sentry_dart_plugin: ^2.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/config/
    - assets/img/intro/

flutter_native_splash:
  color: "#f3f2f7"
  color_dark: "#101316"
  image: assets/img/icon.png
  android_12:
    color: "#f3f2f7"
    color_dark: "#101316"
    image: assets/img/android12_splash_icon.png

flutter_launcher_icons:
  android: true
  min_sdk_android: 21 # android min sdk min:16, default 21
  ios: true
  image_path_ios_dark_transparent: assets/img/ios_dark_icon.png
  image_path_ios_tinted_grayscale: assets/img/ios_tinted_icon.png
  image_path: "assets/img/appicon.png"
  color: "#f3f2f7"
  image_path_android: "assets/img/icon.png"
  adaptive_icon_foreground: "assets/img/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground_inset: 25
  # branding: assets/branding-production.png
  # branding_bottom_padding: 24
  color_dark: "#000000"
  macos:
    generate: true
    image_path: "assets/img/icon.png"
  web:
    generate: true
    image_path: "assets/img/appicon.png"
    background_color: "#32a7d1"
    theme_color: "#32a7d1"

sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  project: class-todo
  org: ycydev
  url: https://ycydev.sentry.io
  wait_for_processing: false
  log_level: error
  release: ...
  dist: ...
  web_build_path: ...
  commits: auto
  ignore_missing: true